name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # src/lib/db.ts refuses to even import without a DATABASE_URL, and `next
  # build` evaluates route modules. Nothing connects during CI, so any
  # syntactically valid URL will do — CI must never see real credentials.
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Not `npm run build`: that runs `prisma migrate deploy`, which belongs
      # to the deploy (Vercel), not to CI — CI has no database to migrate.
      - run: npx next build
